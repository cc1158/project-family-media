version: 2

updates:
  - package-ecosystem: gomod
    directory: /family-media-server
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(go)"

  - package-ecosystem: swift
    directory: /FamilyMediaClient
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(swift)"

  - package-ecosystem: docker
    directory: /family-media-server/deployments/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(actions)"
