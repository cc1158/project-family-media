name: 问题报告
description: 报告可稳定复现的服务端或 Apple 客户端问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请使用示例地址和匿名媒体名称，不要提交 NAS IP、Token、用户名、设备 ID、家庭路径或真实照片/视频。

  - type: dropdown
    id: component
    attributes:
      label: 影响范围
      options:
        - Go 服务端
        - iPhone
        - iPad
        - Apple TV
        - Jellyfin 接入
        - 部署与文档
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 v1.0.0-rc.2、Apple 构建号或脱敏后的服务端提交号
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 实际表现
      description: 说明发生了什么，以及是否有用户可见错误提示。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 进入……
        3. 点击……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 可填写脱敏后的系统版本、设备型号、NAS 架构和 Jellyfin 版本。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不包含地址、Token、账号、设备 ID、媒体名称、家庭路径或家庭影像。
          required: true
