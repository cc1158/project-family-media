name: 功能建议
description: 讨论一个边界清晰的新能力或体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先描述家庭使用场景和希望解决的问题，不要提交任何真实家庭数据或部署地址。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 建议边界
      description: 说明哪些能力应包含，哪些能力本轮不需要。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不包含地址、Token、账号、设备 ID、媒体名称、家庭路径或家庭影像。
          required: true
